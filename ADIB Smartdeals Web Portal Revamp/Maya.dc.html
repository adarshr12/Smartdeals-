<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&amp;family=IBM+Plex+Sans+Arabic:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0">
</helmet>
<div dir="{{ dir }}" style="font-family:{{ font }};color:#14171F">
  <sc-if value="{{ isAvatar }}" hint-placeholder-val="{{ false }}">
    <span aria-hidden="true" style="position:relative;display:block;width:{{ s }}px;height:{{ s }}px;border-radius:50%;background:#013978;box-shadow:0 0 0 2px #fff,0 4px 12px rgba(1,30,70,.25)">
      <span style="position:absolute;top:38%;left:50%;transform:translateX(-50%);display:flex;gap:{{ eyeGap }}px">
        <span style="width:{{ eyeW }}px;height:{{ eyeH }}px;border-radius:999px;background:#fff"></span>
        <span style="width:{{ eyeW }}px;height:{{ eyeH }}px;border-radius:999px;background:#fff"></span>
      </span>
      <span style="position:absolute;top:2%;right:2%;width:{{ dot }}px;height:{{ dot }}px;border-radius:50%;background:#2BC79A;box-shadow:0 0 0 2px #fff"></span>
    </span>
  </sc-if>
  <sc-if value="{{ isFab }}" hint-placeholder-val="{{ false }}">
    <button aria-label="Ask Maya, your offers assistant" style="display:flex;align-items:center;gap:10px;height:60px;padding-inline:6px 18px;border-radius:999px;border:0;background:#fff;box-shadow:0 8px 28px rgba(1,30,70,.22);font:inherit;cursor:pointer" style-focus="outline:3px solid #013978;outline-offset:3px">
      <dc-import name="MayaAvatar" size="{{ 48 }}" hint-size="48px,48px"></dc-import>
      <span style="display:flex;flex-direction:column;align-items:flex-start;line-height:1.2">
        <b style="font-size:15px;font-weight:600;color:#013978">{{ t.ask }}</b>
        <span style="font-size:12px;color:#5B6472">{{ t.fabSub }}</span>
      </span>
    </button>
  </sc-if>
  <sc-if value="{{ isBubble }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;gap:10px;align-items:flex-start;width:{{ bw }}">
      <dc-import name="MayaAvatar" size="{{ 44 }}" style="flex:none" hint-size="44px,44px"></dc-import>
      <div role="dialog" aria-label="Maya guide" style="flex:1;background:#fff;border-radius:16px;border-start-start-radius:4px;box-shadow:0 12px 32px rgba(1,20,50,.28);padding:14px 16px;display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <span style="font-size:12px;font-weight:600;color:#00664F;letter-spacing:.02em">{{ step }}</span>
          <button aria-label="Stop guide" style="width:32px;height:32px;margin:-6px -8px -6px 0;border:0;background:transparent;display:grid;place-items:center;color:#5B6472"><span style="font-family:'Material Symbols Rounded';font-size:20px">close</span></button>
        </div>
        <b style="font-size:16px;font-weight:600;line-height:1.3">{{ title }}</b>
        <span style="font-size:14px;line-height:1.45;color:#3D4450">{{ text }}</span>
        <div style="display:flex;gap:8px;align-items:center;margin-top:4px">
          <button style="height:40px;padding:0 16px;border-radius:999px;border:0;background:#013978;color:#fff;font:inherit;font-size:14px;font-weight:600">{{ primary }}</button>
          <button style="height:40px;padding:0 12px;border-radius:999px;border:0;background:transparent;color:#013978;font:inherit;font-size:14px;font-weight:600">{{ t.stop }}</button>
        </div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ isChat }}" hint-placeholder-val="{{ false }}">
    <section aria-label="Maya assistant" style="width:{{ cw }};height:{{ ch }};background:#fff;border-radius:{{ cr }};box-shadow:0 12px 40px rgba(1,20,50,.22);display:flex;flex-direction:column;overflow:hidden">
      <sc-if value="{{ isSheet }}" hint-placeholder-val="{{ false }}"><div style="display:grid;place-items:center;padding-top:8px"><span style="width:36px;height:4px;border-radius:2px;background:#C9D1DD"></span></div></sc-if>
      <header style="display:flex;align-items:center;gap:10px;padding:12px 8px 12px 16px;padding-inline:16px 8px;border-bottom:1px solid #EEF0F3">
        <dc-import name="MayaAvatar" size="{{ 36 }}" hint-size="36px,36px"></dc-import>
        <div style="flex:1;display:flex;flex-direction:column;line-height:1.25">
          <b style="font-size:15px;font-weight:600">Maya</b>
          <span style="font-size:12px;color:#5B6472">{{ t.role }}</span>
        </div>
        <button onClick="{{ close }}" aria-label="Close assistant" style="width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;color:#14171F"><span style="font-family:'Material Symbols Rounded';font-size:22px">close</span></button>
      </header>
      <div style="flex:1;min-height:0;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:12px;background:#F6F7F9">
        <div style="align-self:flex-end;max-width:80%;background:#013978;color:#fff;font-size:14px;line-height:1.4;padding:10px 14px;border-radius:16px;border-end-end-radius:4px">{{ t.q }}</div>
        <div style="display:flex;gap:8px;align-items:flex-start">
          <dc-import name="MayaAvatar" size="{{ 28 }}" style="flex:none" hint-size="28px,28px"></dc-import>
          <div style="flex:1;display:flex;flex-direction:column;gap:8px">
            <div style="background:#fff;border:1px solid #E6E9EF;font-size:14px;line-height:1.45;padding:10px 14px;border-radius:16px;border-start-start-radius:4px">{{ t.a }}</div>
            <sc-for list="{{ results }}" as="r" hint-placeholder-count="3">
              <div style="display:flex;align-items:center;gap:10px;background:#fff;border:1px solid {{ r.border }};box-shadow:{{ r.ring }};border-radius:12px;padding:8px;padding-inline-end:6px">
                <span style="width:44px;height:44px;flex:none;border-radius:8px;background:{{ r.bg }};display:grid;place-items:center;font-size:11px;font-weight:600" dir="ltr">{{ r.ini }}</span>
                <div style="flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3">
                  <b style="font-size:15px;font-weight:600;color:#00775F">{{ r.value }}</b>
                  <span style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.m }} · {{ r.where }}</span>
                </div>
                <button style="flex:none;height:36px;padding:0 12px;border-radius:999px;border:1px solid #013978;background:{{ r.btnBg }};color:{{ r.btnColor }};font:inherit;font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px"><span style="font-family:'Material Symbols Rounded';font-size:16px">{{ r.btnIcon }}</span>{{ r.btn }}</button>
              </div>
            </sc-for>
            <span style="font-size:12px;color:#5B6472;display:flex;gap:4px;align-items:center"><span style="font-family:'Material Symbols Rounded';font-size:14px">near_me</span>{{ t.proof }}</span>
          </div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:auto">
          <sc-for list="{{ t.chips }}" as="c" hint-placeholder-count="3">
            <button style="height:36px;padding:0 12px;border-radius:999px;border:1px solid #C9D1DD;background:#fff;font:inherit;font-size:13px;color:#14171F">{{ c }}</button>
          </sc-for>
        </div>
      </div>
      <div style="padding:12px 12px 16px;border-top:1px solid #EEF0F3;display:flex;gap:8px;align-items:center">
        <label style="flex:1;height:48px;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;padding-inline:14px 6px;border-radius:999px;border:1px solid #C9D1DD;background:#fff">
          <span style="flex:1;font-size:14px;color:#5B6472;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ t.ph }}</span>
          <span aria-label="Speak" style="width:36px;height:36px;display:grid;place-items:center;color:#013978;font-family:'Material Symbols Rounded';font-size:22px">mic</span>
        </label>
        <button aria-label="Send" style="width:48px;height:48px;border-radius:50%;border:0;background:#013978;color:#fff;display:grid;place-items:center"><span style="font-family:'Material Symbols Rounded';font-size:22px;transform:{{ flip }}">send</span></button>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:640},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;avatar&quot;,&quot;fab&quot;,&quot;bubble&quot;,&quot;panel&quot;,&quot;sheet&quot;],&quot;default&quot;:&quot;panel&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;rtl&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:48,&quot;tsType&quot;:&quot;number&quot;},&quot;highlight&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;step&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Step 1 of 3&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Tap Copy to grab your code&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;primary&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Next&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;width&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;320px&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;height&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, mode = p.mode || 'fab', rtl = !!p.rtl, s = p.size || 48;
    const bg = h => `repeating-linear-gradient(135deg,oklch(0.92 0.04 ${h}) 0 5px,oklch(0.95 0.025 ${h}) 5px 10px)`;
    const EN = { ask: 'Ask Maya', fabSub: 'Find & redeem offers', stop: 'Stop guide', role: 'Finds offers and shows you how to redeem', q: 'Pizza this afternoon near Yas Mall', a: 'Three in-store offers near Yas Mall. No code needed — just pay with your ADIB card.', proof: 'People near you redeemed these this week', ph: 'Ask about any offer…', chips: ['How do I redeem?', 'Only online', 'Show me on the page'], show: 'Show me', open: 'Showing' };
    const AR = { ask: 'اسأل مايا', fabSub: 'ابحث عن العروض واستخدمها', stop: 'إيقاف الدليل', role: 'تجد العروض وتشرح طريقة الاستخدام', q: 'بيتزا بعد الظهر قرب ياس مول', a: 'ثلاثة عروض في المتاجر قرب ياس مول. لا حاجة لكود — ادفع ببطاقة ADIB.', proof: 'استخدمها أشخاص بالقرب منك هذا الأسبوع', ph: 'اسأل عن أي عرض…', chips: ['كيف أستخدم العرض؟', 'أونلاين فقط', 'أرني في الصفحة'], show: 'أرني', open: 'معروض' };
    const t = rtl ? AR : EN;
    const res = [['PE', '20% off', 'PizzaExpress', 'Yas Mall', 55], ['SP', '20% off', 'Sicilian Pizza', '1.2 km', 30], ['PZ', '25% off', 'Pizza Zone', '2 km', 15]];
    const hl = p.highlight ?? 0;
    return {
      close: () => p.onClose && p.onClose(), dir: rtl ? 'rtl' : 'ltr', t, flip: rtl ? 'scaleX(-1)' : 'none',
      font: rtl ? "'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif" : "'IBM Plex Sans',sans-serif",
      isAvatar: mode === 'avatar', isFab: mode === 'fab', isBubble: mode === 'bubble',
      isChat: mode === 'panel' || mode === 'sheet', isSheet: mode === 'sheet',
      s, eyeW: Math.max(3, Math.round(s * 0.11)), eyeH: Math.max(5, Math.round(s * 0.2)), eyeGap: Math.round(s * 0.14), dot: Math.max(6, Math.round(s * 0.24)),
      step: p.step || 'Step 1 of 3', title: p.title || 'Tap Copy to grab your code', text: p.text || 'NAMSHI15 goes to your clipboard. Next I’ll take you to namshi.com and show where to paste it.', primary: p.primary || 'Next', bw: p.width || '320px',
      cw: mode === 'sheet' ? '100%' : '400px', ch: p.height || (mode === 'sheet' ? '600px' : '100%'), cr: mode === 'sheet' ? '20px 20px 0 0' : '16px',
      results: res.map(([ini, value, m, where, h], i) => ({ ini, value, m, where, bg: bg(h),
        border: i === hl ? '#2BC79A' : '#E6E9EF', ring: i === hl ? '0 0 0 3px rgba(43,199,154,.25)' : 'none',
        btn: i === hl ? t.open : t.show, btnIcon: i === hl ? 'my_location' : 'visibility',
        btnBg: i === hl ? '#013978' : '#fff', btnColor: i === hl ? '#fff' : '#013978' })),
    };
  }
}
</script>
</body>
</html>
