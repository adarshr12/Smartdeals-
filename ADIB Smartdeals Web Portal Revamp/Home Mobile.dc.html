<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&amp;family=IBM+Plex+Sans+Arabic:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0">
<script src="data.js"></script>
<style>body{margin:0;background:#F6F7F9}a{color:#013978}a:hover{color:#00275A}</style>
</helmet>
<div dir="{{ dir }}" style="width:390px;background:#F6F7F9;font-family:{{ font }};color:#14171F;overflow:hidden;position:relative;height:{{ rootH }}">
  <div style="position:sticky;top:0;z-index:20">
    <dc-import name="SiteHeader" mobile="{{ true }}" rtl="{{ rtl }}" rotate="{{ false }}" hint-size="100%,112px"></dc-import>
  </div>
  <main style="display:flex;flex-direction:column;gap:24px;padding:16px 0 40px">
    <section aria-roledescription="carousel" aria-label="{{ t.carousel }}" style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;gap:8px;overflow:hidden;padding-inline-start:16px">
        <article style="flex:none;width:calc(100% - 40px);height:184px;border-radius:16px;background:#013978;color:#fff;position:relative;overflow:hidden;display:grid;grid-template-columns:1fr 104px">
          <div style="padding:16px;padding-inline-end:8px;display:flex;flex-direction:column;gap:6px">
            <h1 style="margin:0;font-size:{{ fsH1 }}px;line-height:1.15;font-weight:600">{{ t.h1 }}</h1>
            <p style="margin:0;font-size:14px;line-height:1.35;color:#DCE6F5">{{ t.sub }}</p>
            <a href="#" style="margin-top:auto;align-self:flex-start;height:36px;display:inline-flex;align-items:center;gap:4px;padding:0 14px;border-radius:999px;background:#fff;color:#013978;font-weight:600;font-size:13px;text-decoration:none">{{ t.cta }}<span style="font-family:'Material Symbols Rounded';font-size:18px;transform:{{ flip }}">arrow_forward</span></a>
          </div>
          <div style="margin:10px;margin-inline-start:0;border-radius:10px;background:repeating-linear-gradient(135deg,oklch(0.45 0.08 60) 0 8px,oklch(0.42 0.075 60) 8px 16px);display:grid;place-items:center">
            <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:rgba(255,255,255,.75);text-align:center" dir="ltr">campaign<br>photo</span>
          </div>
        </article>
        <article style="flex:none;width:calc(100% - 40px);height:184px;border-radius:16px;background:#E3EEEA;position:relative">
          <span style="position:absolute;top:12px;inset-inline-start:12px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:#fff;color:#3D4450">{{ t.sponsored }}</span>
        </article>
      </div>
      <div style="display:flex;align-items:center;gap:4px;padding:0 8px">
        <button aria-label="{{ t.prev }}" style="width:44px;height:44px;border:0;background:transparent;color:#013978;display:grid;place-items:center"><span style="font-family:'Material Symbols Rounded';font-size:22px">{{ prevIcon }}</span></button>
        <div style="display:flex;gap:6px;flex:1;justify-content:center">
          <span style="width:20px;height:6px;border-radius:3px;background:#013978"></span>
          <span style="width:6px;height:6px;border-radius:3px;background:#B5C3D8"></span>
        </div>
        <button aria-label="{{ t.pause }}" style="width:44px;height:44px;border:0;background:transparent;color:#013978;display:grid;place-items:center"><span style="font-family:'Material Symbols Rounded';font-size:22px">pause</span></button>
        <button aria-label="{{ t.next }}" style="width:44px;height:44px;border:0;background:transparent;color:#013978;display:grid;place-items:center"><span style="font-family:'Material Symbols Rounded';font-size:22px">{{ nextIcon }}</span></button>
      </div>
    </section>
    <nav aria-label="{{ t.cats }}" style="display:flex;gap:8px;overflow:hidden;padding:0 16px;margin-top:-8px">
      <sc-for list="{{ cats }}" as="c" hint-placeholder-count="5">
        <a href="#" style="flex:none;width:72px;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:#14171F">
          <span style="width:60px;height:60px;border-radius:18px;background:#E6EDF7;display:grid;place-items:center;color:#013978"><span style="font-family:'Material Symbols Rounded';font-size:26px">{{ c.icon }}</span></span>
          <span style="font-size:{{ fsCat }}px;white-space:nowrap">{{ c.label }}</span>
        </a>
      </sc-for>
    </nav>
    <section aria-label="{{ t.askTitle }}" style="margin:0 16px;background:#fff;border-radius:16px;border:1px solid #E6E9EF;padding:14px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:10px">
        <dc-import name="MayaAvatar" size="{{ 40 }}" rtl="{{ rtl }}" style="flex:none" hint-size="40px,40px"></dc-import>
        <div style="display:flex;flex-direction:column;line-height:1.3">
          <b style="font-size:{{ fsAsk }}px;font-weight:600">{{ t.askTitle }}</b>
          <span style="font-size:12px;color:#5B6472">{{ t.askSub }}</span>
        </div>
      </div>
      <label style="height:48px;display:flex;align-items:center;gap:6px;padding-inline:14px 4px;border-radius:999px;border:1.5px solid #013978">
        <span style="flex:1;font-size:14px;color:#5B6472;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ t.askPh }}</span>
        <span aria-label="Speak" style="width:40px;height:40px;display:grid;place-items:center;color:#013978;font-family:'Material Symbols Rounded';font-size:22px">mic</span>
      </label>
      <div style="display:flex;gap:8px;overflow:hidden">
        <sc-for list="{{ t.askChips }}" as="c" hint-placeholder-count="2">
          <a href="#" style="flex:none;height:32px;display:inline-flex;align-items:center;padding:0 12px;border-radius:999px;background:#EEF3FA;color:#013978;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap">{{ c }}</a>
        </sc-for>
      </div>
    </section>
    <sc-for list="{{ rails }}" as="r" hint-placeholder-count="3">
      <section style="display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:8px">
          <div style="display:flex;flex-direction:column;gap:2px">
            <h2 style="margin:0;font-size:{{ fsH2 }}px;line-height:1.3;font-weight:600">{{ r.pre }}<sc-if value="{{ r.temporal }}" hint-placeholder-val="{{ false }}"><span style="color:#013978;background:#E6F4EF;padding:0 4px;border-radius:5px;box-shadow:inset 0 -2px 0 #2BC79A">{{ r.ctx }}</span></sc-if></h2>
            <sc-if value="{{ r.temporal }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:#5B6472;display:flex;gap:4px;align-items:center"><span style="font-family:'Material Symbols Rounded';font-size:14px;color:#013978">schedule</span>{{ r.why }}</span></sc-if>
          </div>
          <a href="#" style="flex:none;font-size:13px;font-weight:600;color:#013978;text-decoration:none;display:flex;align-items:center;gap:2px;min-height:44px">{{ r.seeAll }}<span style="font-family:'Material Symbols Rounded';font-size:16px;transform:{{ flip }}">arrow_forward</span></a>
        </div>
        <div style="display:flex;gap:12px;overflow:hidden;padding:0 16px 4px;align-items:stretch">
          <sc-for list="{{ r.three }}" as="o" hint-placeholder-count="3">
            <dc-import name="OfferCard" offer="{{ o }}" rtl="{{ rtl }}" compact="{{ true }}" style="flex:none;width:152px" hint-size="152px,270px"></dc-import>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </main>
  <footer style="background:#323644;color:#D5D9E2;padding:24px 16px;display:flex;flex-direction:column;gap:12px;font-size:12px;line-height:1.6">
    <img src="assets/adib-logo-footer.png" alt="ADIB" style="height:64px;align-self:flex-start">
    <div style="display:flex;gap:20px;font-size:13px"><a href="#" style="color:#fff">{{ t.privacy }}</a><a href="#" style="color:#fff">{{ t.faqs }}</a><span>customerservice@adib.ae</span></div>
    <p style="margin:0">{{ t.legal }}</p>
  </footer>
  <sc-if value="{{ showFab }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;inset-inline-end:16px;top:756px;z-index:25"><dc-import name="Maya" mode="fab" rtl="{{ rtl }}" hint-size="190px,60px"></dc-import></div>
  </sc-if>
  <sc-if value="{{ sheet }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;background:rgba(10,22,44,.4);z-index:30"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;z-index:31"><dc-import name="Maya" mode="sheet" rtl="{{ rtl }}" height="640px" highlight="{{ -1 }}" hint-size="390px,640px"></dc-import></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;rtl&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;assist&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;fab&quot;,&quot;chat&quot;],&quot;default&quot;:&quot;fab&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    if (!window.SD) this.t = setInterval(() => { if (window.SD) { clearInterval(this.t); this.forceUpdate(); } }, 50);
  }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const SD = window.SD || { rails: [], cats: [] };
    const rtl = !!this.props.rtl;
    const EN = { carousel: 'Featured campaigns', eyebrow: 'Ramadan · Dining', h1: 'Iftar & Suhoor offers', sub: 'Up to 40% off at 120+ restaurants', cta: 'Explore offers', sponsored: 'Sponsored', prev: 'Previous slide', next: 'Next slide', pause: 'Pause slideshow', cats: 'Categories', askTitle: 'Just ask Maya', askSub: 'Find an offer or learn how to redeem it', askPh: 'Try “pizza near me this afternoon”', askChips: ['How do I use a code?', 'Iftar for 4 near me', '0% instalments'], privacy: 'Privacy Policy', faqs: 'FAQs', legal: '© Abu Dhabi Islamic Bank PJSC, licensed by the Central Bank of the UAE. Offers are extended by merchants; the Bank facilitates payment only. Powered by maya.ai' };
    const AR = { carousel: 'الحملات المميزة', eyebrow: 'رمضان · مطاعم', h1: 'عروض الإفطار والسحور', sub: 'خصم حتى 40% في أكثر من 120 مطعمًا', cta: 'تصفّح العروض', sponsored: 'إعلان', prev: 'الشريحة السابقة', next: 'الشريحة التالية', pause: 'إيقاف العرض', cats: 'الفئات', askTitle: 'اسأل مايا', askSub: 'ابحث عن عرض أو تعرّف على طريقة استخدامه', askPh: 'جرّب «بيتزا قريبة بعد الظهر»', askChips: ['كيف أستخدم الكود؟', 'إفطار لأربعة قريب', 'أقساط بدون فوائد'], privacy: 'سياسة الخصوصية', faqs: 'الأسئلة الشائعة', legal: '© مصرف أبوظبي الإسلامي ش.م.ع، مرخّص من مصرف الإمارات العربية المتحدة المركزي. العروض مقدّمة من التجّار ويقتصر دور المصرف على تسهيل الدفع. مدعوم من maya.ai' };
    const sheet = this.props.assist === 'chat';
    const all = SD.temporal ? [SD.temporal, ...SD.rails] : SD.rails;
    return {
      sheet, showFab: !sheet, rootH: sheet ? '844px' : 'auto', fsAsk: rtl ? 17 : 16,
      rtl, dir: rtl ? 'rtl' : 'ltr', t: rtl ? AR : EN,
      font: rtl ? "'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif" : "'IBM Plex Sans',sans-serif",
      flip: rtl ? 'scaleX(-1)' : 'none',
      prevIcon: rtl ? 'chevron_right' : 'chevron_left', nextIcon: rtl ? 'chevron_left' : 'chevron_right',
      fsH1: rtl ? 22 : 20, fsH2: rtl ? 19 : 17, fsCat: rtl ? 13 : 12,
      cats: SD.cats.map(c => ({ ...c, label: rtl ? c.ar : c.en })),
      rails: all.map(r => ({ ...r, temporal: !!r.temporal, pre: r.temporal ? (rtl ? r.preAr : r.pre) : (rtl ? r.ar : r.title), ctx: rtl ? r.ctxAr : r.ctx, why: rtl ? r.whyAr : r.why, three: r.items.slice(0, 3), seeAll: rtl ? `عرض الكل (${r.n})` : `See all (${r.n})` })),
    };
  }
}
</script>
</body>
</html>
