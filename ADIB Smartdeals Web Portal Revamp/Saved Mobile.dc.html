<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&amp;family=IBM+Plex+Sans+Arabic:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0">
<script src="data.js"></script>
<style>body{margin:0;background:#F6F7F9}a{color:#013978}a:hover{color:#00275A}</style>
</helmet>
<div style="width:390px;background:#F6F7F9;font-family:'IBM Plex Sans',sans-serif;color:#14171F;min-height:844px">
  <div style="position:sticky;top:0;z-index:20">
    <dc-import name="SiteHeader" mobile="{{ true }}" rotate="{{ false }}" hint-size="100%,112px"></dc-import>
  </div>
  <main style="padding:16px 16px 40px;display:flex;flex-direction:column;gap:20px">
    <div style="display:flex;align-items:baseline;justify-content:space-between">
      <h1 style="margin:0;font-size:28px;line-height:1.2;font-weight:600">Saved offers</h1>
      <span style="font-size:14px;color:#5B6472">7 saved</span>
    </div>
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
      <section style="display:flex;flex-direction:column;gap:8px">
        <h2 style="margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px">{{ g.title }}<span style="font-size:13px;font-weight:400;color:#5B6472">{{ g.count }}</span></h2>
        <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="2">
          <article style="background:#fff;border-radius:16px;border:1px solid #E6E9EF;padding:12px;display:flex;gap:12px;align-items:flex-start">
            <div style="position:relative;width:76px;height:76px;flex:none;border-radius:12px;background:{{ r.bg }};filter:{{ r.filter }}">
              <span style="position:absolute;bottom:-6px;inset-inline-end:-6px;width:32px;height:32px;border-radius:8px;background:#fff;box-shadow:0 1px 4px rgba(16,24,40,.14);display:grid;place-items:center;font-size:11px;font-weight:600">{{ r.ini }}</span>
            </div>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
              <span style="align-self:flex-start;font-size:14px;font-weight:600;color:{{ r.endsColor }};background:{{ r.endsBg }};padding:{{ r.endsPad }};border-radius:8px;margin-bottom:2px">{{ r.ends }}</span>
              <span style="font-size:18px;font-weight:600;line-height:1.25;color:{{ r.valColor }}">{{ r.value }}</span>
              <span style="font-size:14px;color:#14171F">{{ r.m }}</span>
              <span style="font-size:12px;color:#5B6472">{{ r.badge }}</span>
              <sc-if value="{{ r.expired }}" hint-placeholder-val="{{ false }}">
                <a href="#" style="margin-top:4px;align-self:flex-start;min-height:36px;display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:#013978;text-decoration:none">See similar live offers<span style="font-family:'Material Symbols Rounded';font-size:18px">arrow_forward</span></a>
              </sc-if>
            </div>
            <button aria-label="Remove from saved" style="width:44px;height:44px;margin:-6px -6px 0 0;border:0;background:transparent;display:grid;place-items:center;color:{{ r.heartColor }};flex:none"><span style="font-family:'Material Symbols Rounded';font-size:24px;font-variation-settings:'FILL' 1">favorite</span></button>
          </article>
        </sc-for>
      </section>
    </sc-for>
    <section style="display:flex;flex-direction:column;gap:8px">
      <button onClick="{{ toggle }}" aria-expanded="{{ open }}" style="height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-radius:16px;border:1px solid #E6E9EF;background:#fff;font:inherit;font-size:16px;font-weight:600;color:#14171F;cursor:pointer">Expired (2)<span style="font-family:'Material Symbols Rounded';font-size:24px;color:#013978">{{ chev }}</span></button>
      <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
        <sc-for list="{{ expiredRows }}" as="r" hint-placeholder-count="2">
          <article style="background:#fff;border-radius:16px;border:1px solid #E6E9EF;padding:12px;display:flex;gap:12px;align-items:flex-start">
            <div style="position:relative;width:76px;height:76px;flex:none;border-radius:12px;background:{{ r.bg }};filter:grayscale(1);opacity:.7">
              <span style="position:absolute;bottom:-6px;inset-inline-end:-6px;width:32px;height:32px;border-radius:8px;background:#fff;display:grid;place-items:center;font-size:11px;font-weight:600">{{ r.ini }}</span>
            </div>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
              <span style="font-size:14px;font-weight:600;color:#5B6472">{{ r.ends }}</span>
              <span style="font-size:18px;font-weight:600;color:#5B6472">{{ r.value }}</span>
              <span style="font-size:14px;color:#3D4450">{{ r.m }}</span>
              <a href="#" style="margin-top:4px;align-self:flex-start;min-height:36px;display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:#013978;text-decoration:none">See similar live offers<span style="font-family:'Material Symbols Rounded';font-size:18px">arrow_forward</span></a>
            </div>
          </article>
        </sc-for>
      </sc-if>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;expiredOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { open: !!this.props.expiredOpen };
  componentDidMount() {
    if (!window.SD) this.t = setInterval(() => { if (window.SD) { clearInterval(this.t); this.forceUpdate(); } }, 50);
  }
  componentDidUpdate(pp) { if (pp.expiredOpen !== this.props.expiredOpen) this.setState({ open: !!this.props.expiredOpen }); }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const SD = window.SD;
    const bg = h => `repeating-linear-gradient(135deg,oklch(0.92 0.04 ${h}) 0 6px,oklch(0.95 0.025 ${h}) 6px 12px)`;
    const row = (id, days) => {
      const o = SD ? SD.O[id] : { m: '', hue: 250 };
      const urgent = days != null && days <= 7;
      return { ...o, bg: bg(o.hue), filter: 'none', ends: days == null ? 'Valid until 31 Dec' : days === 0 ? 'Ends today' : `Ends in ${days} days`,
        endsColor: urgent ? '#8A4B00' : '#5B6472', endsBg: urgent ? '#FFF4DB' : 'transparent', endsPad: urgent ? '2px 8px' : '0',
        valColor: '#00775F', heartColor: '#013978' };
    };
    return {
      open: this.state.open, chev: this.state.open ? 'expand_less' : 'expand_more',
      toggle: () => this.setState(s => ({ open: !s.open })),
      groups: !SD ? [] : [
        { title: 'Ending this week', count: '3', rows: [row('namshi', 3), row('pizzaexpress', 5), row('img', 6)] },
        { title: 'Active', count: '2', rows: [row('bloomingdales'), row('apple')] },
      ],
      expiredRows: SD ? [{ ...SD.O.levelshoes, bg: bg(15), ends: 'Expired 2 Oct' }, { ...SD.O.funcity, bg: bg(310), ends: 'Expired 28 Sep' }] : [],
    };
  }
}
</script>
</body>
</html>
